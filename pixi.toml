[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "morrow"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.7.0"

[dependencies]
mojo = ">=1.1.0,<1.2"

[tasks]
test = "mojo run -I . tests/test_morrow.mojo && mojo run -I . tests/test_formatter.mojo && mojo run -I . tests/test_timedelta.mojo && mojo run -I . tests/test_timezone.mojo"

[package]
name = "morrow"
version = "0.7.0"
description = "Human-friendly date and time utilities for Mojo."
license = "Apache-2.0"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.7,<1" }
source = { path = "." }

[package.build.config.pkg]
name = "morrow"
path = "morrow"

[package.host-dependencies]
mojo = ">=1.1.0,<1.2"

[package.run-dependencies]
mojo = ">=1.1.0,<1.2"
