name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-26
            platform: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Determine package version
        id: package
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ -n "${tag}" ]]; then
            version="${tag#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/.*__version__ = "\([^"]*\)"/\1/p' morrow/__init__.mojo)
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Test and package with Mojo 1.0 and 1.1
        shell: bash
        run: |
          for version in 1.0.0 1.1.0; do
            echo "::group::Mojo ${version}"
            export MOJO_VERSION="${version}"
            make install
            make test build
            archive="morrow-${{ steps.package.outputs.version }}-mojo-${version}-${{ matrix.platform }}"
            mkdir -p "dist/${archive}"
            cp morrow.mojoc LICENSE README.md "dist/${archive}/"
            tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"
            python tools/check_package.py "dist/${archive}.tar.gz"
            echo "::endgroup::"
          done

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Morrow ${RELEASE_TAG}"
          fi
