name: Build and Release

env:
  MOJO_VERSION: "1.0.0"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-26
            platform: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
          make install

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Determine package version
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version=$(sed -n 's/.*__version__ = "\([^"]*\)"/\1/p' morrow/__init__.mojo)
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create release archive
        shell: bash
        run: |
          archive="morrow-${{ steps.package.outputs.version }}-mojo-${MOJO_VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/${archive}"
          cp morrow.mojoc LICENSE README.md "dist/${archive}/"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Morrow ${GITHUB_REF_NAME}"
          fi
