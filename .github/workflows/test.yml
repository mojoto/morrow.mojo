name: Run Tests

on: [pull_request, push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
          make install
      - name: Test
        run: make test
