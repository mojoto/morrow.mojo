name: Run Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Test and build with Mojo 1.0 and 1.1
        shell: bash
        run: |
          for version in 1.0.0 1.1.0; do
            echo "::group::Mojo ${version}"
            export MOJO_VERSION="${version}"
            make install
            make test
            TZ=America/New_York uv run mojo run -I . tests/test_iterators.mojo
            uv run --with arrow==1.4.0 python tools/check_arrow.py
            make build
            python tools/check_package.py morrow.mojoc
            echo "::endgroup::"
          done
