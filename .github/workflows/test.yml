name: Run Tests

on: [pull_request, push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        mojo: ["1.0.0", "1.1.0"]
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
    runs-on: ${{ matrix.os }}
    env:
      MOJO_VERSION: ${{ matrix.mojo }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
          make install
      - name: Test
        run: make test
      - name: Build
        run: make build
